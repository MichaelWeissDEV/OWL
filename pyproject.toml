[project]
name = "owl"
version = "0.1.0"
description = "OWL - a skill manager with standalone, git, client and server modes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Michael", email = "150333378+MichaelWeissDEV@users.noreply.github.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
keywords = ["ai", "agents", "skills", "skill-manager", "git", "registry"]
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1"]

[project.urls]
Documentation = "https://owl-skills.readthedocs.io"
Repository = "https://github.com/MichaelWeissDEV/OWL"

[project.scripts]
owl = "owl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
